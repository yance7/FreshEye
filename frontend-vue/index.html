      <h1>鲜眸 FreshEye · 鱼眼视觉新鲜度参考</h1>
      <p>FreshEye 根据鱼眼照片提供新鲜度视觉参考和模型关注区域。结果不代表食品检验、质量合格判定、保质期预测或食用安全结论。</p>
      <h2>照片分析</h2>
      <p>启用 JavaScript 后，可以上传鱼眼照片并分析。支持 JPG、PNG 和 WebP；拍摄时请让镜头正对鱼眼并避免模糊和强反光。</p>
