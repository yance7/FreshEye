name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Playwright 1.55's bundled dependency installer supports Ubuntu 24.04.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-vue/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend-vue
      - name: Run frontend tests
        run: npm test
        working-directory: frontend-vue
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend-vue
      - name: Run browser acceptance tests
        run: npm run test:e2e
        working-directory: frontend-vue
      - name: Build Vue frontend
        run: npm run build
        working-directory: frontend-vue
      - name: Record deployed commit
        run: printf '{"sha":"%s"}\n' "$GITHUB_SHA" > frontend-dist/version.json
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './frontend-dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
